name: Test setup-nuget semver range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nuget
        uses: .
        with:
          nuget-version: '5.x'
      - name: Assert nuget-version output is in 5.x range
        env:
          ACTUAL: ${{ steps.setup-nuget.outputs.nuget-version }}
        run: |
          echo "nuget-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: nuget-version output is empty"
            exit 1
          fi
          if echo "$ACTUAL" | grep -qE "^5\."; then
            echo "PASS: nuget version '$ACTUAL' is in the 5.x range"
          else
            echo "FAIL: expected a 5.x version, got: $ACTUAL"
            exit 1
          fi
      - name: Assert nuget script is on PATH
        run: |
          echo "Checking nuget is on PATH..."
          if ! command -v nuget > /dev/null 2>&1; then
            echo "FAIL: nuget command not found on PATH"
            exit 1
          fi
          echo "PASS: nuget found at $(command -v nuget)"
      - name: Assert nuget.exe file exists
        run: |
          NUGET_PATH="$NUGET"
          echo "NUGET env var: $NUGET_PATH"
          if [ -z "$NUGET_PATH" ]; then
            echo "FAIL: NUGET env var is not set"
            exit 1
          fi
          if [ ! -f "$NUGET_PATH" ]; then
            echo "FAIL: nuget.exe not found at $NUGET_PATH"
            exit 1
          fi
          echo "PASS: nuget.exe found at $NUGET_PATH"
