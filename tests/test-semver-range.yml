name: Test setup-nuget semver range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          nuget-version: '5.x'
      - name: Assert nuget is available
        run: |
          echo "Checking nuget is on PATH..."
          if ! command -v nuget &>/dev/null; then
            echo "FAIL: nuget command not found on PATH"
            exit 1
          fi
          echo "PASS: nuget found at $(command -v nuget)"
      - name: Assert nuget version is in 5.x range
        run: |
          VERSION_OUTPUT=$(nuget help 2>&1 | head -1 || true)
          echo "nuget version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qE "5\.[0-9]+\.[0-9]+"; then
            echo "PASS: nuget version in 5.x range confirmed"
          else
            echo "FAIL: expected a 5.x version in output, got: $VERSION_OUTPUT"
            exit 1
          fi
