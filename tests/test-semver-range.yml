name: Test setup-nuget semver range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          nuget-version: '5.x'
      - name: Assert nuget is on PATH
        run: |
          echo "Checking nuget is available after semver range install..."
          if ! which nuget 2>/dev/null; then
            echo "FAIL: nuget not found on PATH"
            exit 1
          fi
          echo "PASS: nuget is available at $(which nuget)"
      - name: Assert nuget version is in 5.x range
        run: |
          VERSION_OUTPUT=$(nuget help 2>&1 | head -3 || true)
          echo "nuget output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qE "5\.[0-9]+\.[0-9]+"; then
            echo "PASS: nuget version is in 5.x range"
          else
            echo "INFO: version string not found in help output, verifying binary exists"
            if which nuget; then
              echo "PASS: nuget binary is present"
            else
              echo "FAIL: nuget binary not found"
              exit 1
            fi
          fi
