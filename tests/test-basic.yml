name: Test basic usage - latest NuGet
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nuget
        uses: .
        with:
          nuget-version: 'latest'
      - name: Assert nuget is available
        run: |
          echo "Checking nuget is on PATH..."
          which nuget || { echo "FAIL: nuget not found on PATH"; exit 1; }
          echo "PASS: nuget found on PATH"
      - name: Assert nuget runs
        run: |
          echo "Running nuget help..."
          nuget help 2>&1 | head -5 || { echo "FAIL: nuget command failed"; exit 1; }
          echo "PASS: nuget command ran successfully"
