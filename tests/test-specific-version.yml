name: Test setup-nuget specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          nuget-version: '5.3.1'
      - name: Assert nuget is available
        run: |
          echo "Checking nuget is on PATH..."
          if ! command -v nuget &>/dev/null; then
            echo "FAIL: nuget command not found on PATH"
            exit 1
          fi
          echo "PASS: nuget found at $(command -v nuget)"
      - name: Assert nuget version is 5.3.1
        run: |
          VERSION_OUTPUT=$(nuget help 2>&1 | head -1 || true)
          echo "nuget version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "5\.3\.1"; then
            echo "PASS: nuget version 5.3.1 confirmed"
          else
            echo "FAIL: expected version 5.3.1 in output, got: $VERSION_OUTPUT"
            exit 1
          fi
