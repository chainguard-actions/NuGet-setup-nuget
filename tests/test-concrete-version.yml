name: Test setup-nuget concrete version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nuget
        uses: .
        with:
          nuget-version: '6.3.1'
      - name: Assert nuget-version output equals 6.3.1
        env:
          ACTUAL: ${{ steps.setup-nuget.outputs.nuget-version }}
        run: |
          echo "nuget-version output: $ACTUAL"
          if [ "$ACTUAL" != "6.3.1" ]; then
            echo "FAIL: expected nuget-version '6.3.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: nuget-version output is '6.3.1'"
      - name: Assert NUGET env var points to 6.3.1
        run: |
          echo "NUGET env var: $NUGET"
          if [ -z "$NUGET" ]; then
            echo "FAIL: NUGET environment variable is not set"
            exit 1
          fi
          if echo "$NUGET" | grep -q "6.3.1"; then
            echo "PASS: NUGET path contains 6.3.1"
          else
            echo "FAIL: NUGET path does not contain 6.3.1: $NUGET"
            exit 1
          fi
      - name: Assert nuget.exe file exists at 6.3.1 path
        run: |
          echo "NUGET path: $NUGET"
          if [ ! -f "$NUGET" ]; then
            echo "FAIL: nuget.exe file does not exist at $NUGET"
            exit 1
          fi
          echo "PASS: nuget.exe exists at $NUGET"
      - name: Assert nuget script is on PATH
        run: |
          echo "Checking nuget is on PATH..."
          if ! command -v nuget >/dev/null 2>&1; then
            echo "FAIL: nuget command not found on PATH"
            exit 1
          fi
          echo "PASS: nuget found at $(command -v nuget)"
