name: Test setup-nuget basic (latest)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nuget
        uses: .
        with:
          nuget-version: 'latest'
      - name: Assert nuget-version output is set
        env:
          ACTUAL: ${{ steps.setup-nuget.outputs.nuget-version }}
        run: |
          echo "nuget-version output: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: nuget-version output is not set"
            exit 1
          fi
          echo "PASS: nuget-version output is '$ACTUAL'"
      - name: Assert NUGET env var is set
        run: |
          echo "NUGET env var: $NUGET"
          if [ -z "$NUGET" ]; then
            echo "FAIL: NUGET environment variable is not set"
            exit 1
          fi
          echo "PASS: NUGET is set to '$NUGET'"
      - name: Assert nuget.exe file exists
        run: |
          echo "NUGET path: $NUGET"
          if [ ! -f "$NUGET" ]; then
            echo "FAIL: nuget.exe file does not exist at $NUGET"
            exit 1
          fi
          echo "PASS: nuget.exe exists at $NUGET"
      - name: Assert nuget script is on PATH
        run: |
          echo "Checking nuget is on PATH..."
          if ! command -v nuget >/dev/null 2>&1; then
            echo "FAIL: nuget command not found on PATH"
            exit 1
          fi
          echo "PASS: nuget found at $(command -v nuget)"
